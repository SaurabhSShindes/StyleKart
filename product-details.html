
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details | StyleKart</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="product-detail-page">

        <a href="index.html" class="back-home">
            <i class="fa-solid fa-arrow-left"></i> Back to Products
        </a>

        <div class="product-detail-container">

            <!-- Product Image -->
            <div class="detail-image">
                <img id="detailImage"
                     src="images/shirt.jpg"
                     alt="Product Image">
            </div>

            <!-- Product Information -->
            <div class="detail-info">

                <p id="detailCategory">Men's Clothing</p>

                <h1 id="detailName">Casual Cotton Shirt</h1>

                <div class="detail-rating">
                    ★★★★★ <span>(24 Reviews)</span>
                </div>

                <h2 id="detailPrice">₹799</h2>

                <p class="detail-description">
                    Explore our stylish fashion collection.
                    Comfortable fabric with a modern design.
                    Perfect for everyday wear.
                </p>

                <!-- Size Selection -->
                <div class="size-selection">

                    <h3>Select Size</h3>

                    <div class="size-options">
                        <button type="button">S</button>
                        <button type="button">M</button>
                        <button type="button">L</button>
                        <button type="button">XL</button>
                    </div>

                </div>

                <!-- Quantity -->
                <div class="quantity-section">

                    <h3>Quantity</h3>

                    <div class="quantity-box">
                        <button type="button" id="decreaseQty">-</button>

                        <span id="quantity">1</span>

                        <button type="button" id="increaseQty">+</button>
                    </div>

                </div>

                <!-- Add To Cart -->
                <button type="button" id="detailAddCart">
                    <i class="fa-solid fa-bag-shopping"></i>
                    Add to Cart
                </button>

            </div>

        </div>

    </div>

    <script src="product-details.js"></script>
</body>
</html>
